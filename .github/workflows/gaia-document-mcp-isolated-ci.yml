name: GAIA Document MCP - isolated contract CI
on:
  push:
    branches:
      - feat/gaia-document-mcp-isolado
    paths:
      - "gaia_document_mcp/**"
      - "schemas/**"
      - "config/document-mcp.env.example"
      - "docs/document-mcp/**"
      - "tests/test_document_mcp.py"
      - ".github/workflows/gaia-document-mcp-isolated-ci.yml"
  pull_request:
    paths:
      - "gaia_document_mcp/**"
      - "schemas/**"
      - "config/document-mcp.env.example"
      - "docs/document-mcp/**"
      - "tests/test_document_mcp.py"
      - ".github/workflows/gaia-document-mcp-isolated-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract syntax
        run: python -m compileall -q gaia_document_mcp tests/test_document_mcp.py
      - name: Contract unit tests - no services or credentials
        run: python -m unittest discover -s tests -p test_document_mcp.py -v
      - name: Verify deployment remains frozen
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ('.github/workflows/rag-ghcr-image.yml', '.github/workflows/rag-linode-staging.yml'):
              txt=Path(path).read_text()
              assert 'if: false' in txt or 'if: ${{ false }}' in txt, f"DEPLOY_FREEZE_MISSING {path}"
          print('Verified: existing publish/deploy jobs remain frozen')
          PY

