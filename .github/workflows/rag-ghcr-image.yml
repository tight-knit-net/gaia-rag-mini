name: GAIA RAG Mini - GHCR publishing disabled until approval
# INTENTIONALLY DISABLED: no automatic publishing on push to main.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: ${{ false }} # Explicit no-publish/no-deploy freeze; requires future reviewed change.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify build prerequisites
        run: |
          test -f Dockerfile || { echo "::error::Dockerfile not present. Runtime code has not been ported."; exit 1; }
          test -f src/server.py -o -f server.py -o -f app/server.py || { echo "::error::Server code missing. Build gate blocked."; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/tight-knit-net/gaia-rag-mini:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Digest for manual staging deployment
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'GHCR image: ghcr.io/tight-knit-net/gaia-rag-mini@%s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Use workflow GAIA RAG Mini - Linode staging (manual), mode=deploy, digest=%s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
