name: R05 skill static validation
on:
  pull_request:
  push:
    branches:
      - docs/r05-gaia-rag-homologacao
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate skill structure
        run: python skills/gaia-rag-processos-administrativos/scripts/validate_skill.py
      - name: Static regression (no host, no network)
        run: python skills/gaia-rag-processos-administrativos/tests/test_regressao_r05.py
      - name: Validate CI and Linode deployment manifests
        run: |
          python - <<'PY'
          import pathlib, yaml
          for name in (
              ".github/workflows/r05-skill-static.yml",
              ".github/workflows/rag-ghcr-image.yml",
              ".github/workflows/rag-linode-staging.yml",
              ".github/deploy/linode/compose.staging.yml",
          ):
              data = yaml.safe_load(pathlib.Path(name).read_text())
              assert isinstance(data, dict), name
              print("YAML OK:", name)
          PY
          bash -n .github/deploy/linode/gaia-rag-mini-deploy.sh
          bash -n .github/deploy/linode/ssh-gate.sh
          if test -f scripts/install-staging.sh; then bash -n scripts/install-staging.sh; fi
          test -s .github/deploy/linode/known_hosts
          echo "Shell/known_hosts OK"
      - name: Validate archive locally without uploading artifacts
        run: |
          set -Eeuo pipefail
          zip -rq "$RUNNER_TEMP/gaia-rag-processos-administrativos-r05.zip" skills/gaia-rag-processos-administrativos
          unzip -tq "$RUNNER_TEMP/gaia-rag-processos-administrativos-r05.zip"
          sha256sum "$RUNNER_TEMP/gaia-rag-processos-administrativos-r05.zip"
          echo "Archive validated in ephemeral runner only; not uploaded or published."
      - name: R05 backend authorization unit tests (synthetic, no network)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Assert GHCR and Linode deployment freeze
        run: |
          python - <<'PY'
          from pathlib import Path
          image = Path(".github/workflows/rag-ghcr-image.yml").read_text()
          deploy = Path(".github/workflows/rag-linode-staging.yml").read_text()
          ci = Path(".github/workflows/r05-skill-static.yml").read_text()
          disabled = "if: $" + "{{ false }}"
          assert disabled in image, "GHCR workflow must remain disabled"
          assert disabled in deploy, "Linode workflow must remain disabled"
          assert "on:\n  push:" not in image, "GHCR push trigger must stay absent"
          review_ci = __import__("yaml").safe_load(ci)
          upload_steps = [
              step for job in review_ci["jobs"].values()
              for step in job.get("steps", [])
              if str(step.get("uses", "")).startswith("actions/upload" + "-artifact@")
          ]
          assert not upload_steps, "No ZIP upload step permitted in this phase"
          print("OK: publication and deploy gates remain blocked")
          PY

  staging_image_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build private local image only (no registry publishing)
        if: hashFiles('Dockerfile') != ''
        run: docker build -t gaia-rag-mini:r05-ci .
      - name: Start staging MCP with no production secrets
        if: hashFiles('Dockerfile') != ''
        run: |
          set -Eeuo pipefail
          docker run -d --name gaia-rag-mini-ci --read-only \
            --tmpfs /tmp:size=64m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 \
            --cpus 1 --memory 1024m -p 127.0.0.1:18082:8000 \
            gaia-rag-mini:r05-ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18082/healthz > /tmp/gaia-r05-health.json; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/gaia-r05-health.json').read_text())
          assert health['alive'] is True
          assert health['mode'] == 'staging-controlled'
          assert health['writes_enabled'] is False
          assert health['qdrant_configured'] is False
          print('Isolated runtime health verified; no production credentials.')
          PY
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            http://127.0.0.1:18082/mcp)
          test "$code" = 401 || { echo "Auth must deny; got HTTP $code"; exit 1; }
          echo "Unauthorized MCP access correctly rejected (HTTP 401)"
      - name: Real Qdrant synthetic isolation tests (no production data)
        run: |
          set -Eeuo pipefail
          docker network create --internal gaia-rag-r05-synthetic-net
          cleanup() {
            docker rm -f gaia-rag-r05-qdrant-test 2>/dev/null || true
            docker network rm gaia-rag-r05-synthetic-net 2>/dev/null || true
          }
          trap cleanup EXIT
          docker run -d --name gaia-rag-r05-qdrant-test \
            --network gaia-rag-r05-synthetic-net \
            --tmpfs /qdrant/storage:rw,size=128m \
            --cpus 1 --memory 512m --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e QDRANT__TELEMETRY_DISABLED=true \
            qdrant/qdrant:v1.15.5
          docker run --rm --network gaia-rag-r05-synthetic-net \
            --read-only --tmpfs /tmp:rw,size=32m \
            --cpus 1 --memory 384m --pids-limit 96 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$PWD/tests/test_live_qdrant_synthetic.py:/app/tests_real_qdrant.py:ro" \
            --entrypoint python gaia-rag-mini:r05-ci /app/tests_real_qdrant.py
      - name: Print isolated logs on failure
        if: failure()
        run: docker logs gaia-rag-mini-ci --tail 100 || true
      - name: Stop ephemeral container
        if: always()
        run: docker rm -f gaia-rag-mini-ci 2>/dev/null || true

  r06_lifecycle_synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build local R06 image (no publishing, no real secrets)
        run: docker build -t gaia-rag-mini:r06-ci .
      - name: Start isolated Qdrant and test two-stage human approval
        run: |
          set -Eeuo pipefail
          docker network create --internal gaia-rag-r06-ci-net
          cleanup() {
            docker rm -f gaia-rag-r06-demo-qdrant 2>/dev/null || true
            docker network rm gaia-rag-r06-ci-net 2>/dev/null || true
          }
          trap cleanup EXIT
          docker run -d --name gaia-rag-r06-demo-qdrant \
            --network gaia-rag-r06-ci-net \
            --tmpfs /qdrant/storage:rw,size=128m \
            --tmpfs /qdrant/snapshots:rw,size=64m \
            --cpus 1 --memory 512m --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e QDRANT__TELEMETRY_DISABLED=true \
            qdrant/qdrant:v1.15.5
          docker run --rm --network gaia-rag-r06-ci-net \
            --read-only --tmpfs /tmp:rw,mode=1777,size=64m \
            --cpus 1 --memory 768m --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$PWD/tests/r06_live_review_e2e.py:/app/r06_test.py:ro" \
            --entrypoint python gaia-rag-mini:r06-ci /app/r06_test.py
          echo "R06 real synthetic MCP review -> Qdrant -> readback PASS"


  r07_operational_isolated:
    name: R07 isolated operational smoke (ephemeral runner, no cloud secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate Docker runtime with no network, secrets or public ports
        run: bash tests/r07_isolated_runtime_smoke.sh


  r07_skill_router_synthetic:
    name: R07 Skilldrum route simulation (offline, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fixed route taxonomy, digest binding and progressive loads
        run: python -m unittest discover -s tests -p 'test_r07_skill_router.py' -v

  r07_host_contract_synthetic:
    name: R07 host-driven skill loading contract (CI simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate explicit host selection, complete chunks, hashes and denial
        run: python -m unittest discover -s tests -p 'test_r07_host_contract.py' -v

  r07_s6_security:
    name: R07 S6 security boundaries and legacy ledger compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify owner access, CSRF, discard state and migration fail-closed
        run: python -m unittest discover -s tests -p 'test_r07_s6_security.py' -v


  r07_s7_package:
    name: R07 S7 pinned package and runtime attestation (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinning, state mounts, identity and disabled deploy
        run: python scripts/r07_s7_package_preflight.py
      - name: Build only on ephemeral GitHub-hosted runner
        run: docker build --tag gaia-rag-mini:r07-s7-pinned .
      - name: Verify installed packages and non-root container
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' gaia-rag-mini:r07-s7-pinned)" = "10001:10001"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cpus 1 --memory 768m --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$PWD/scripts/r07_s7_package_preflight.py,dst=/tmp/r07_s7_package_preflight.py,readonly" \
            --entrypoint python gaia-rag-mini:r07-s7-pinned \
            /tmp/r07_s7_package_preflight.py --inside-runtime --root /app
          printf 'R07_S7_PINNED_RUNTIME_PASS\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'requirements.lock SHA256: %s\n' "$(sha256sum requirements.lock | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

  r07_s7_sqlite_recovery:
    name: R07 S7 SQLite WAL backup and isolated restore (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test SQLite online backup integrity and no-overwrite rollback
        run: python -m unittest discover -s tests -p 'test_r07_s7_recovery.py' -v

  r07_s8_supplychain:
    name: R07 S8 CycloneDX SBOM and public Python advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test deterministic BOM and fail-closed advisory coverage
        run: python -m unittest discover -s tests -p 'test_r07_s8_supplychain.py' -v
      - name: Generate CycloneDX SBOM from pinned Python dependency lock
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/r07_s8_supplychain.py \
            --lock requirements.lock \
            --sbom-out "$RUNNER_TEMP/gaia-r07-python-lock.cdx.json"
          python scripts/r07_s8_supplychain.py \
            --lock requirements.lock \
            --verify-sbom "$RUNNER_TEMP/gaia-r07-python-lock.cdx.json"
          python scripts/r07_s8_supplychain.py \
            --lock requirements.lock \
            --verify-sbom docs/institucional/R07_SBOM_PYTHON_LOCK_S8.cdx.json
          test -s "$RUNNER_TEMP/gaia-r07-python-lock.cdx.json"
          printf 'S8 lock-based CycloneDX SBOM SHA256: %s\n' \
            "$(sha256sum "$RUNNER_TEMP/gaia-r07-python-lock.cdx.json" | cut -d' ' -f1)" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Audit ONLY public pinned package names and versions via PyPI advisories
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
          audit_status=0
          pip-audit --requirement requirements.lock --no-deps --disable-pip \
            --format json --output "$RUNNER_TEMP/gaia-r07-advisories.json" \
            || audit_status=$?
          if test -s "$RUNNER_TEMP/gaia-r07-advisories.json"; then
            python scripts/r07_s8_supplychain.py \
              --lock requirements.lock \
              --verify-sbom "$RUNNER_TEMP/gaia-r07-python-lock.cdx.json" \
              --audit-report "$RUNNER_TEMP/gaia-r07-advisories.json" \
              || audit_status=1
          else
            echo 'NO-GO: PyPI advisory report unavailable; cannot claim clean scan.'
            audit_status=1
          fi
          if test "$audit_status" -ne 0; then
            echo 'NO-GO: known vulnerability, incomplete advisory coverage, or scan failure.'
            exit 1
          fi
          printf 'S8 public PyPI advisory scan: 29/29 pinned dependencies, zero findings.\n' \
            >> "$GITHUB_STEP_SUMMARY"

  r07_s8_review_and_snapshot:
    name: R07 S8 replay readback and native snapshot decision (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simulate review replay and fail-closed Qdrant native snapshot plans
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests -p 'test_r07_s8_review_integrity.py' -v
          python -m unittest discover -s tests -p 'test_r07_s8_snapshot_contract.py' -v

  r07_s9_hash_bootstrap:
    name: R07 S9 wheel hash verification (public PyPI, temporary runner)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned public linux-amd64 wheels, generate/check hash manifest
        run: python scripts/r07_s9_wheel_lock.py --verify

  r07_s9_os_scan:
    name: R07 S9 Debian OS SBOM and Grype public vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Debian package BOM and scanner result fail-closed handling
        run: python -m unittest discover -s tests -p 'test_r07_s9_os_audit.py' -v
      - name: Build the candidate Docker image only on an ephemeral runner
        run: docker build --tag gaia-rag-mini:r07-s9-os .
      - name: Generate CycloneDX OS manifest from actual installed packages
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --entrypoint dpkg-query gaia-rag-mini:r07-s9-os \
            -W '-f=${Package}\t${Version}\t${Architecture}\n' > "$RUNNER_TEMP/r07-dpkg.tsv"
          docker run --rm --network none --read-only --cap-drop ALL \
            --entrypoint dpkg-query gaia-rag-mini:r07-s9-os \
            -W '-f=${Version}\n' zlib1g | \
            grep -Fx '1:1.3.dfsg+really1.3.1-1+deb13u1'
          echo 'S9.1 security-patched zlib1g version verified in ephemeral image.' >> "$GITHUB_STEP_SUMMARY"
          python scripts/r07_s9_os_audit.py --dpkg-list "$RUNNER_TEMP/r07-dpkg.tsv" \
            --sbom-out "$RUNNER_TEMP/r07-os-packages.cdx.json"
          test -s "$RUNNER_TEMP/r07-os-packages.cdx.json"
          printf 'S9 OS SBOM SHA256: %s\n' \
            "$(sha256sum "$RUNNER_TEMP/r07-os-packages.cdx.json" | cut -d' ' -f1)" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Audit Debian OS CVEs using isolated Grype version v0.122.0
        shell: bash
        run: |
          set -Eeuo pipefail
          docker save -o "$RUNNER_TEMP/r07-s9-image.tar" gaia-rag-mini:r07-s9-os
          chmod a+r "$RUNNER_TEMP/r07-s9-image.tar"
          mkdir -p "$RUNNER_TEMP/r07-grype-db" "$RUNNER_TEMP/r07-grype-work"
          chmod 1777 "$RUNNER_TEMP/r07-grype-db" "$RUNNER_TEMP/r07-grype-work"
          docker pull anchore/grype@sha256:013e16ae96bd64108973e3e9fecec63f7ff276358d34c46c25d33e2aac96539f
          docker run --rm --network bridge --read-only \
            --tmpfs /tmp:rw,mode=1777,size=128m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --env GRYPE_DB_CACHE_DIR=/tmp/grype-db \
            --env TMPDIR=/tmp/grype-work \
            --env GRYPE_CHECK_FOR_APP_UPDATE=false \
            --volume "$RUNNER_TEMP/r07-grype-db:/tmp/grype-db:rw" \
            --volume "$RUNNER_TEMP/r07-grype-work:/tmp/grype-work:rw" \
            --volume "$RUNNER_TEMP/r07-s9-image.tar:/scan/r07-s9-image.tar:ro" \
            anchore/grype@sha256:013e16ae96bd64108973e3e9fecec63f7ff276358d34c46c25d33e2aac96539f \
            docker-archive:/scan/r07-s9-image.tar --output json \
            > "$RUNNER_TEMP/r07-grype-os.json"
          test -s "$RUNNER_TEMP/r07-grype-os.json"
          python scripts/r07_s9_os_audit.py \
            --dpkg-list "$RUNNER_TEMP/r07-dpkg.tsv" \
            --grype-json "$RUNNER_TEMP/r07-grype-os.json"
          printf 'S9 Debian package Grype scan: no HIGH/CRITICAL/UNKNOWN OS findings.\n' \
            >> "$GITHUB_STEP_SUMMARY"

  r07_s9_1_base_comparison:
    name: R07 S9.1 supported Python 3.12 base comparison (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [slim-bookworm, slim-trixie]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed CVE comparison without live services
        run: python -m unittest discover -s tests -p 'test_r07_s9_1_compare_os.py' -v
      - name: Resolve official supported Python image tag to immutable digest
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "python:3.12-${{ matrix.variant }}"
          immutable="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "python:3.12-${{ matrix.variant }}")"
          [[ "$immutable" =~ ^python@sha256:[a-f0-9]{64}$ ]] || { echo 'INVALID_BASE_DIGEST'; exit 1; }
          echo "IMAGE_REF=$immutable" >> "$GITHUB_ENV"
          echo "S9.1 base reference: $immutable" >> "$GITHUB_STEP_SUMMARY"
          { printf 'FROM %s\n' "$immutable"; tail -n +2 Dockerfile; } \
            > "$RUNNER_TEMP/Dockerfile.s91"
          # Bookworm cannot install the Debian-13-specific zlib security version.
          # Remove the variant-specific install ONLY from this temporary comparison
          # Dockerfile; never edit the tracked R07 Dockerfile or hide scan findings.
          if [[ "${{ matrix.variant }}" == "slim-bookworm" ]]; then
            grep -Fq 'zlib1g=1:1.3.dfsg+really1.3.1-1+deb13u1' "$RUNNER_TEMP/Dockerfile.s91"
            sed -i '/^# S9\.1: Debian official trixie-security fix/,/^    rm -rf \/var\/lib\/apt\/lists\/\*/d' "$RUNNER_TEMP/Dockerfile.s91"
            ! grep -q 'zlib1g=' "$RUNNER_TEMP/Dockerfile.s91"
          fi
      - name: Build complete R07 candidate only on disposable GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build -f "$RUNNER_TEMP/Dockerfile.s91" \
            -t "gaia-rag-mini:s91-${{ matrix.variant }}" .
          docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            "gaia-rag-mini:s91-${{ matrix.variant }}" | grep -Fx linux/amd64
          docker save -o "$RUNNER_TEMP/s91-image.tar" \
            "gaia-rag-mini:s91-${{ matrix.variant }}"
          chmod a+r "$RUNNER_TEMP/s91-image.tar"
          mkdir -p "$RUNNER_TEMP/s91-db" "$RUNNER_TEMP/s91-work"
          chmod 1777 "$RUNNER_TEMP/s91-db" "$RUNNER_TEMP/s91-work"
      - name: Full public Debian CVE comparison using pinned Grype
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull anchore/grype@sha256:013e16ae96bd64108973e3e9fecec63f7ff276358d34c46c25d33e2aac96539f
          docker run --rm --network bridge --read-only \
            --tmpfs /tmp:rw,mode=1777,size=128m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --env GRYPE_DB_CACHE_DIR=/tmp/grype-db \
            --env TMPDIR=/tmp/grype-work \
            --env GRYPE_CHECK_FOR_APP_UPDATE=false \
            --volume "$RUNNER_TEMP/s91-db:/tmp/grype-db:rw" \
            --volume "$RUNNER_TEMP/s91-work:/tmp/grype-work:rw" \
            --volume "$RUNNER_TEMP/s91-image.tar:/scan/s91-image.tar:ro" \
            anchore/grype@sha256:013e16ae96bd64108973e3e9fecec63f7ff276358d34c46c25d33e2aac96539f \
            docker-archive:/scan/s91-image.tar --output json \
            > "$RUNNER_TEMP/s91-grype.json"
          test -s "$RUNNER_TEMP/s91-grype.json"
          python scripts/r07_s9_1_compare_os.py --report "$RUNNER_TEMP/s91-grype.json" \
            --image "$IMAGE_REF" --variant "${{ matrix.variant }}"
          echo "Comparison only: HIGH/CRITICAL/UNKNOWN findings still block original S9 OS job." \
            >> "$GITHUB_STEP_SUMMARY"

  r07_s9_2_stable_upgrade:
    name: R07 S9.2 official Debian stable/security update trial (no promotion)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify stable-only trial policy and fail-closed comparison tests
        run: python -m unittest discover -s tests -p 'test_r07_s92_stable_update.py' -v
      - name: Create disposable upgrade trial without modifying tracked Dockerfile
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/r07_s92_stable_update.py --dockerfile Dockerfile \
            --write-trial "$RUNNER_TEMP/Dockerfile.r07-s92"
          grep -Fq 'apt-get upgrade -y --no-install-recommends' \
            "$RUNNER_TEMP/Dockerfile.r07-s92"
          grep -Fq -- '--require-hashes --only-binary=:all:' \
            "$RUNNER_TEMP/Dockerfile.r07-s92"
          docker build -t gaia-rag-mini:r07-s92-original .
          docker build -f "$RUNNER_TEMP/Dockerfile.r07-s92" \
            -t gaia-rag-mini:r07-s92-trial .
          for tag in original trial; do
            image="gaia-rag-mini:r07-s92-$tag"
            docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image" \
              | grep -Fx linux/amd64
            docker run --rm --network none --read-only --cap-drop ALL \
              --entrypoint dpkg-query "$image" \
              -W '-f=${Package}\t${Version}\t${Architecture}\n' \
              > "$RUNNER_TEMP/r07-s92-$tag-dpkg.tsv"
            docker save -o "$RUNNER_TEMP/r07-s92-$tag.tar" "$image"
            chmod a+r "$RUNNER_TEMP/r07-s92-$tag.tar"
          done
          mkdir -p "$RUNNER_TEMP/r07-s92-db" "$RUNNER_TEMP/r07-s92-work"
          chmod 1777 "$RUNNER_TEMP/r07-s92-db" "$RUNNER_TEMP/r07-s92-work"
      - name: Run original and stable-only trial Grype scans using public advisory DB
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull anchore/grype@sha256:013e16ae96bd64108973e3e9fecec63f7ff276358d34c46c25d33e2aac96539f
          for tag in original trial; do
            docker run --rm --network bridge --read-only \
              --tmpfs /tmp:rw,mode=1777,size=128m \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --env GRYPE_DB_CACHE_DIR=/tmp/grype-db \
              --env TMPDIR=/tmp/grype-work \
              --env GRYPE_CHECK_FOR_APP_UPDATE=false \
              --volume "$RUNNER_TEMP/r07-s92-db:/tmp/grype-db:rw" \
              --volume "$RUNNER_TEMP/r07-s92-work:/tmp/grype-work:rw" \
              --volume "$RUNNER_TEMP/r07-s92-$tag.tar:/scan/image.tar:ro" \
              anchore/grype@sha256:013e16ae96bd64108973e3e9fecec63f7ff276358d34c46c25d33e2aac96539f \
              docker-archive:/scan/image.tar --output json \
              > "$RUNNER_TEMP/r07-s92-$tag-grype.json"
            test -s "$RUNNER_TEMP/r07-s92-$tag-grype.json"
          done
          python scripts/r07_s92_stable_update.py \
            --before-scan "$RUNNER_TEMP/r07-s92-original-grype.json" \
            --after-scan "$RUNNER_TEMP/r07-s92-trial-grype.json" \
            --before-dpkg "$RUNNER_TEMP/r07-s92-original-dpkg.tsv" \
            --after-dpkg "$RUNNER_TEMP/r07-s92-trial-dpkg.tsv"
          echo 'S9.2 comparison ONLY; original R07 OS Grype blocking gate remains mandatory.' \
            >> "$GITHUB_STEP_SUMMARY"

  r07_candidate_acceptance:
    name: R07 code-candidate acceptance (CI only, no deploy)
    needs:
