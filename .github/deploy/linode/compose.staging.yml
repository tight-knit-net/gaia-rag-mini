# Gaia RAG Mini — staging, isolated from existing NestGround workloads
name: gaia-rag-mini-staging
services:
  gaia-rag-mini:
    image: ${RAG_IMAGE:?Docker image digest is required}
    container_name: gaia-rag-mini-staging
    restart: unless-stopped
    init: true
    env_file:
      - /opt/gaia-rag-mini/secrets/runtime.env
    ports:
      - "127.0.0.1:18081:8000"
    volumes:
      - gaia_rag_review_state:/state
    cpus: "1.0"
    mem_limit: 1024m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  default:
    name: gaia-rag-mini-staging-net
    # 172.17.0.0/16 is intercepted by Cloudflare WARP on nestground-ai.
    # Use the dedicated local bridge subnet already verified by host HTTP tests.
    ipam:
      config:
        - subnet: 172.19.41.0/24
volumes:
  gaia_rag_review_state:
    name: gaia-rag-mini-staging-state
