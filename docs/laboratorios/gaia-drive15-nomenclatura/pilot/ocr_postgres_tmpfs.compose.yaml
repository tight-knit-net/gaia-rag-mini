# GAIA OCR Pilot PostgreSQL — banco sintético TEMPORÁRIO, sem arquivos reais
# PostgreSQL em tmpfs, sem host ports, sem volumes persistentes e sem egress.
name: gaia-ocr-pilot-pg
services:
  db:
    image: postgres:16-alpine
    restart: "no"
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 64m
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    environment:
      POSTGRES_USER: gaiaocr
      POSTGRES_DB: gaiaocr
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=512m,mode=0700,uid=70,gid=70
      - /tmp:rw,nosuid,nodev,size=32m
      - /var/run/postgresql:rw,nosuid,nodev,size=8m,mode=0770,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U gaiaocr -d gaiaocr"]
      interval: 3s
      timeout: 2s
      retries: 15
    networks: [private]
secrets:
  pg_password:
    file: ${GAIA_OCR_PG_SECRET_FILE:?Set path of temporary 0600 secret file outside GitHub}
networks:
  private:
    internal: true
